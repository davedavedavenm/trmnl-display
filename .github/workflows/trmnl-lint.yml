name: trmnlp lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: trmnlp lint (advisory official best-practice check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pull official trmnlp image
        run: docker pull trmnl/trmnlp

      - name: >-
          Run official trmnlp lint over every plugins/* (advisory). Findings are
          reported as warnings and never block CI: our colour templates
          intentionally use inline styles (the official Framework classes target
          the monochrome 2-bit panel and cannot express ACeP colours), and
          sidecar-primary plugins ship only the layouts they render. See
          docs/PLUGIN_RECIPE_CONTRACT.md. trmnlp lint exposes no per-rule
          suppression flag, so advisory is the terminal posture for colour and
          sidecar plugins (not a temporary net); the inline-style and
          single-layout findings are accepted exceptions.
        run: |
          shopt -s nullglob
          for d in plugins/*/; do
            id="$(basename "$d")"
            echo "::group::trmnlp lint ${id}"
            rm -rf "${d}src"
            mkdir -p "${d}src"
            cp "${d}settings.yml" "${d}src/" 2>/dev/null || true
            cp "${d}"*.liquid "${d}src/" 2>/dev/null || true
            printf 'watch:\n  - src\n' > "${d}.trmnlp.yml"
            if ! docker run --rm -v "$PWD/${d%/}:/plugin" -w /plugin trmnl/trmnlp lint; then
              echo "::warning::${id}: trmnlp lint reported best-practice findings (advisory, non-blocking; see group log). Colour templates use inline styles by design; sidecar-only plugins ship no Liquid markup."
            else
              echo "PASS ${id}"
            fi
            rm -rf "${d}src" "${d}.trmnlp.yml"
            echo "::endgroup::"
          done
