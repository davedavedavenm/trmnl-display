name: trmnlp lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint every plugin with the official trmnlp image (safe rollout)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pull official trmnlp image
        run: docker pull trmnl/trmnlp

      - name: >-
          Lint each plugins/* with the official trmnlp container via a flat->src
          shim; tolerate the four sidecar-only plugins (no Liquid by design, see
          docs/PLUGIN_RECIPE_CONTRACT.md). continue-on-error stays as a temporary
          net until a run confirms real PASS lines with no ::error::, then remove it.
        continue-on-error: true
        run: |
          rc=0
          SIDECAR_ONLY="trmnl-bus-departures trmnl-calendar-dayview trmnl-hp-quotes trmnl-jen-coming-home"
          shopt -s nullglob
          for d in plugins/*/; do
            id="$(basename "$d")"
            echo "::group::trmnlp lint ${id}"
            rm -rf "${d}src"
            mkdir -p "${d}src"
            cp "${d}settings.yml" "${d}src/" 2>/dev/null || true
            cp "${d}"*.liquid "${d}src/" 2>/dev/null || true
            printf 'watch:\n  - src\n' > "${d}.trmnlp.yml"
            if docker run --rm -v "$PWD/${d%/}:/plugin" -w /plugin trmnl/trmnlp lint; then
              echo "PASS ${id}"
            else
              case " ${SIDECAR_ONLY} " in
                *" ${id} "*)
                  echo "::warning::${id} is sidecar-only (image via LaraPaper generated-image handoff); trmnlp lint markup findings are expected and tolerated."
                  ;;
                *)
                  echo "::error::${id} failed trmnlp lint"
                  rc=1
                  ;;
              esac
            fi
            rm -rf "${d}src" "${d}.trmnlp.yml"
            echo "::endgroup::"
          done
          exit "$rc"
