name: UK Bus Departures (TransportAPI)
no_screen_padding: 'no'
dark_mode: 'no'
strategy: polling
refresh_interval: 2
id: trmnl-bus-departures
custom_fields:
  - keyname: atco
    name: ATCO Code
    field_type: string
    default: ""
    description: ATCO stop code for your bus stop
    placeholder: "0100BRP90003"
  - keyname: timespan
    name: Timespan
    field_type: select
    default: "2"
    options:
      - "1 hour": "1"
      - "2 hours": "2"
      - "3 hours": "3"
      - "4 hours": "4"
    description: How far ahead to fetch departures.
  - keyname: app_id
    name: TransportAPI App ID
    field_type: string
    default: ""
    description: Your TransportAPI application ID
    placeholder: "your-app-id"
  - keyname: app_key
    name: TransportAPI API Key
    field_type: password
    default: ""
    description: Your TransportAPI API key
    placeholder: "your-api-key"
  - keyname: stop_name
    name: Stop Display Name
    field_type: string
    default: "Bus Stop"
    optional: true
    description: Friendly name shown on the colour sidecar display.
    placeholder: "Main Road"
