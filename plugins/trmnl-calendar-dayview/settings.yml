name: Calendar Week Ahead
no_screen_padding: 'no'
dark_mode: 'no'
strategy: polling
refresh_interval: 60
id: trmnl-calendar-weekahead
custom_fields:
  - keyname: theme
    name: Theme
    field_type: select
    default: dark
    options:
      - "Dark (black background)": "dark"
      - "Light (white background)": "light"
    description: Visual theme for the calendar display
  - keyname: layout
    name: Layout
    field_type: select
    default: featured
    options:
      - "Featured (large event cards)": "featured"
      - "Agenda (compact list)": "agenda"
      - "Week Strip (7-day columns)": "weekstrip"
    description: Layout style for the calendar view
  - keyname: nango_base_url
    name: Nango Base URL
    field_type: string
    default: "https://nango.example.com"
    description: Nango API base URL for calendar proxy
  - keyname: nango_secret_key
    name: Nango Secret Key
    field_type: password
    default: ""
    description: Nango API secret key for authenticating calendar fetches

  # Calendar 1
  - keyname: calendar_1_connection_id
    name: Calendar 1 Connection
    field_type: select
    optional: true
    options:
      - "Disabled": ""
      - "REDACTED@example.com (Google)": "REDACTED-CONNECTION"
      - "REDACTED@example.com (Google)": "REDACTED-CONNECTION"
      - "REDACTED@example.com (Google)": "REDACTED-CONNECTION"
      - "REDACTED@example.com (Google)": "google-calendar-davidmagnus"
      - "REDACTED@example.com (Google)": "REDACTED-UUID"
      - "REDACTED@example.com (Outlook)": "REDACTED-CONNECTION"
      - "REDACTED@example.com (Outlook)": "REDACTED-UUID"
      - "david_magnus@hotmail.com (Outlook)": "REDACTED-UUID"
  - keyname: calendar_1_calendar_id
    name: Calendar 1 ID
    field_type: string
    optional: true
    description: Specific calendar ID (defaults to primary)
  - keyname: calendar_1_label
    name: Calendar 1 Label
    field_type: string
    optional: true
    description: Display label override
  - keyname: calendar_1_color
    name: Calendar 1 Color
    field_type: select
    default: blue
    options:
      - "Blue": "blue"
      - "Red": "red"
      - "Green": "green"
      - "Yellow": "yellow"
      - "Orange": "orange"
      - "Black": "black"
  - keyname: calendar_1_color_custom
    name: Calendar 1 Custom Color
    field_type: string
    optional: true
    description: Optional hex code override (e.g. #FF00FF)

