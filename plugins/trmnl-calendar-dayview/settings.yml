name: Calendar Week Ahead
no_screen_padding: 'no'
dark_mode: 'no'
strategy: webhook
refresh_interval: 60
id: trmnl-calendar-weekahead
custom_fields:
  - keyname: theme
    name: Theme
    field_type: select
    default: dark
    options:
      - {key: dark, value: "Dark (black background)"}
      - {key: light, value: "Light (white background)"}
    description: Visual theme for the calendar display
  - keyname: layout
    name: Layout
    field_type: select
    default: featured
    options:
      - {key: featured, value: "Featured (large event cards)"}
      - {key: agenda, value: "Agenda (compact list)"}
      - {key: weekstrip, value: "Week Strip (7-day columns)"}
    description: Layout style for the calendar view
  - keyname: nango_base_url
    name: Nango Base URL
    field_type: string
    default: "https://nango.example.com"
    description: Nango API base URL for calendar proxy
  - keyname: nango_secret_key
    name: Nango Secret Key
    field_type: password
    default: ""
    description: Nango API secret key for authenticating calendar fetches

  # Calendar 1
  - keyname: calendar_1_connection_id
    name: Calendar 1 Connection
    field_type: select
    optional: true
    options:
      - {key: "", value: "Disabled"}
      - {key: "REDACTED-CONNECTION", value: "REDACTED@example.com (Google)"}
      - {key: "REDACTED-CONNECTION", value: "REDACTED@example.com (Google)"}
      - {key: "REDACTED-CONNECTION", value: "REDACTED@example.com (Google)"}
      - {key: "REDACTED-UUID", value: "REDACTED@example.com (Google)"}
      - {key: "REDACTED-CONNECTION", value: "REDACTED@example.com (Outlook)"}
      - {key: "REDACTED-UUID", value: "REDACTED@example.com (Outlook)"}
      - {key: "REDACTED-UUID", value: "david_magnus@hotmail.com (Outlook)"}
  - keyname: calendar_1_calendar_id
    name: Calendar 1 ID
    field_type: string
    optional: true
    description: Specific calendar ID (defaults to primary)
  - keyname: calendar_1_label
    name: Calendar 1 Label
    field_type: string
    optional: true
    description: Display label override
  - keyname: calendar_1_color
    name: Calendar 1 Color
    field_type: select
    default: blue
    options:
      - {key: blue, value: "Blue"}
      - {key: red, value: "Red"}
      - {key: green, value: "Green"}
      - {key: yellow, value: "Yellow"}
      - {key: orange, value: "Orange"}
      - {key: black, value: "Black"}
  - keyname: calendar_1_color_custom
    name: Calendar 1 Custom Color
    field_type: string
    optional: true
    description: Optional hex code override (e.g. #FF00FF)

