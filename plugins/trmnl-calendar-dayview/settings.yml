name: Calendar Week Ahead
no_screen_padding: 'no'
dark_mode: 'no'
strategy: webhook
refresh_interval: 60
id: trmnl-calendar-weekahead
custom_fields:
  - keyname: theme
    name: Theme
    field_type: select
    default: dark
    options:
      - {key: dark, value: "Dark (black background)"}
      - {key: light, value: "Light (white background)"}
    description: Visual theme for the calendar display
  - keyname: layout
    name: Layout
    field_type: select
    default: featured
    options:
      - {key: featured, value: "Featured (large event cards)"}
      - {key: agenda, value: "Agenda (compact list)"}
      - {key: weekstrip, value: "Week Strip (7-day columns)"}
    description: Layout style for the calendar view
  - keyname: nango_base_url
    name: Nango Base URL
    field_type: string
    default: "https://nango.example.com"
    description: Nango API base URL for calendar proxy
  - keyname: nango_secret_key
    name: Nango Secret Key
    field_type: password
    default: ""
    description: Nango API secret key for authenticating calendar fetches
