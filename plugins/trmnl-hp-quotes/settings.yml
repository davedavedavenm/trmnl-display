name: Harry Potter Quotes
description: A colour sidecar-rendered Harry Potter quote display for Spectra-class e-paper panels. Shows a random quote with decorative house-themed layout. Designed for full-screen evening display and half-vertical morning mashup use.
author: David
version: 1.0.0
no_screen_padding: 'yes'
dark_mode: 'no'
strategy: webhook
refresh_interval: 10
id: trmnl-hp-quotes
custom_fields:
  - keyname: layout_mode
    field_type: text
    name: Layout Mode
    default: "full_screen"
    placeholder: "full_screen"
  - keyname: theme
    field_type: text
    name: Theme
    default: "parchment"
    placeholder: "parchment"
  - keyname: house_accent
    field_type: text
    name: House Accent
    default: "auto"
    placeholder: "auto"
  - keyname: show_house_banner
    field_type: checkbox
    name: Show house banner when known
    default: "1"
  - keyname: show_source_book
    field_type: checkbox
    name: Show source book
    default: "1"
  - keyname: screen_label
    field_type: text
    name: Screen Label
    default: "Harry Potter"
    placeholder: "Harry Potter"
