name: Jen Morning
no_screen_padding: 'no'
dark_mode: 'no'
strategy: webhook
refresh_interval: 5
id: trmnl-jen-morning
custom_fields:
  - keyname: layout_mode
    name: Layout Mode
    field_type: select
    default: mashup
    options:
      - Mashup: mashup
      - Standalone: standalone
    description: "Layout mode: mashup for split-screen with HP quote, standalone for full-screen commute display."
  - keyname: layout_variant
    name: Layout Variant
    field_type: select
    default: automotive_hud
    options:
      - Swiss Typographic: swiss_typographic
      - Infographic Roadmap: infographic_timeline
      - Bauhaus Geometric: bauhaus_geometric
      - Automotive HUD: automotive_hud
      - Split Contrast: split_contrast
      - Bento Grid: bento_grid
      - Minimalist: minimalist
      - Dark Tech: dark_tech
    description: "Visual style for the commute display. Maps Style uses a bold left/right split with gradient panels."
  - keyname: screen_label
    name: Screen Label
    field_type: string
    default: Morning Commute
    optional: true
    description: Header label shown at the top of the commute panel.
  - keyname: headline_fallback
    name: Headline Fallback
    field_type: string
    default: Time To Work
    optional: true
    description: Fallback headline used when the webhook payload does not provide one.
  - keyname: colour_profile
    name: Colour Profile
    field_type: select
    default: navy_blue
    options:
      - Navy Blue: navy_blue
      - Slate: slate
      - Forest: forest
    description: Colour profile for the left commute panel gradient and accents.
  - keyname: eta_label
    name: ETA Label
    field_type: string
    default: DRIVE TIME
    optional: true
    description: Label displayed below the ETA value.
  - keyname: eta_unit_label
    name: ETA Unit Label
    field_type: string
    default: min
    optional: true
    description: Unit label shown beside the ETA value.
  - keyname: show_distance
    name: Show Distance
    field_type: boolean
    default: true
    optional: true
  - keyname: distance_unit_label
    name: Distance Unit
    field_type: string
    default: km
    optional: true
    description: Unit suffix displayed with the route distance.
